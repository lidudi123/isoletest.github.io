<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            padding: 20px;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #cbd5f5;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>404</h1>
    <p>The page you are looking for does not exist.</p>

    <button onclick="goBack()">Go back to i-sole.eu</button>
</div>

<script>
    function goBack() {
        window.location.replace('https://i-sole.eu');
    }
</script>
</body>
</html>
